name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# One deployment per branch/PR at a time; a newer push cancels the older run.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Build-time settings baked into the bundle. Change them under
  # Settings > Secrets and variables > Actions > Variables, then re-run.
  VITE_USE_MOCK_API: ${{ vars.VITE_USE_MOCK_API || 'true' }}
  VITE_MOCK_USERNAME: ${{ vars.VITE_MOCK_USERNAME || 'admin' }}
  VITE_MOCK_PASSWORD: ${{ vars.VITE_MOCK_PASSWORD || 'admin123' }}
  VITE_MOCK_ROLE: ${{ vars.VITE_MOCK_ROLE || 'admin' }}
  # Empty: the browser calls /api on the same origin and vercel.json proxies it to the backend.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    # Skip PRs from forks: they cannot read the secrets anyway.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: >
          vercel pull --yes
          --environment=${{ github.event_name == 'push' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Type-check and build
        # Runs "npm run build" (vue-tsc + vite build) with the VITE_* env above.
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->'
            const body = `${marker}\n🔍 **Preview deployment:** ${process.env.PREVIEW_URL}\n\nCommit: ${context.payload.pull_request.head.sha.slice(0, 7)}`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
